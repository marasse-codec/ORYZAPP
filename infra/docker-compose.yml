services:
  excalidraw:
    image: excalidraw/excalidraw:latest
    container_name: aderiz-excalidraw
    ports:
      - 59778:80
  
  app:
    image: laravel-homemade:latest
    container_name: aderiz-app
    restart: unless-stopped
    working_dir: /var/www/laravel-aderiz-app
    volumes:
      - ../:/var/www/laravel-aderiz-app

  # Envoie les notifications (file « database ») : sans lui, elles restent en attente.
  queue:
    image: laravel-homemade:latest
    container_name: aderiz-queue
    restart: unless-stopped
    working_dir: /var/www/laravel-aderiz-app
    command: php artisan queue:work --tries=3 --sleep=3 --max-time=3600
    volumes:
      - ../:/var/www/laravel-aderiz-app
    depends_on:
      - db

  # Lance les tâches planifiées (sauvegarde de 2 h, résumé quotidien de 7 h).
  scheduler:
    image: laravel-homemade:latest
    container_name: aderiz-scheduler
    restart: unless-stopped
    working_dir: /var/www/laravel-aderiz-app
    command: php artisan schedule:work
    volumes:
      - ../:/var/www/laravel-aderiz-app
    depends_on:
      - db

  nginx:
    image: nginx:latest
    container_name: aderiz-nginx
    restart: unless-stopped
    ports:
      - 83:80
    volumes:
      - ../:/var/www/laravel-aderiz-app
      - ./app.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    image: dhi.io/mysql:8.4-debian13-dev
    container_name: aderiz-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - 3307:3306
    volumes:
      - aderiz-mysql-data:/var/lib/mysql

volumes:
  aderiz-mysql-data: