<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="707px" preserveAspectRatio="none" style="width:444px;height:707px;background:#FFFFFF;" version="1.1" viewBox="0 0 444 707" width="444px" zoomAndPan="magnify"><title>Cas d'utilisation : Planificateur (acteur syst&#232;me)</title><defs/><g><text fill="#000000" font-family="Segoe UI" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="329.1777" x="50.4111" y="23.5625">Cas d'utilisation : Planificateur (acteur syst&#232;me)</text><!--cluster <b>Plateforme ORYZA</b>--><g id="cluster_&lt;b&gt;Plateforme ORYZA&lt;/b&gt;"><rect fill="#FFFFFF" height="463" rx="2.5" ry="2.5" style="stroke:#2B6CB0;stroke-width:2.0;" width="289" x="139" y="238.9395"/><text fill="#2B6CB0" font-family="Segoe UI" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="128.7139" x="219.1431" y="254.502">Plateforme ORYZA</text></g><g id="elem_UC_Sauver"><ellipse cx="283.4362" cy="390.1129" fill="#F7FAFC" rx="111.4362" ry="27.1734" style="stroke:#1A202C;stroke-width:2.0;"/><text fill="#000000" font-family="Segoe UI" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="139.9727" x="210.4499" y="385.6744">Sauvegarder la base</text><text fill="#000000" font-family="Segoe UI" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="120.1689" x="220.3518" y="402.6139">et les pi&#232;ces (2 h)</text></g><g id="elem_UC_Controler"><ellipse cx="283.5727" cy="569.054" fill="#F7FAFC" rx="128.5727" ry="28.1145" style="stroke:#1A202C;stroke-width:2.0;"/><text fill="#000000" font-family="Segoe UI" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="170.3857" x="195.3798" y="564.6155">Contr&#244;ler l'&#226;ge et la taille</text><text fill="#000000" font-family="Segoe UI" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="152.3594" x="204.393" y="581.555">des sauvegardes (3 h)</text></g><g id="elem_UC_Resume"><ellipse cx="283.6156" cy="659.0714" fill="#F7FAFC" rx="102.1156" ry="27.132" style="stroke:#1A202C;stroke-width:2.0;"/><text fill="#000000" font-family="Segoe UI" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="127.1484" x="217.0414" y="654.633">Envoyer le r&#233;sum&#233;</text><text fill="#000000" font-family="Segoe UI" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="98.7656" x="231.2328" y="671.5724">quotidien (7 h)</text></g><g id="elem_UC_Rappels"><ellipse cx="283.6255" cy="301.0968" fill="#F7FAFC" rx="107.6255" ry="27.1574" style="stroke:#1A202C;stroke-width:2.0;"/><text fill="#000000" font-family="Segoe UI" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="134.7295" x="213.2607" y="296.6583">Envoyer les rappels</text><text fill="#000000" font-family="Segoe UI" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="89.7148" x="235.7681" y="313.5978">du lundi (8 h)</text></g><g id="elem_UC_Battement"><ellipse cx="283.4675" cy="479.1306" fill="#E6F4EA" rx="115.9675" ry="27.1912" style="stroke:#1A202C;stroke-width:2.0;"/><text fill="#000000" font-family="Segoe UI" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="146.207" x="207.364" y="474.6922">Signaler son passage</text><text fill="#000000" font-family="Segoe UI" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="112.3008" x="224.3171" y="491.6316">(chaque minute)</text></g><!--entity Horloge--><g id="elem_Horloge"><ellipse cx="49.5586" cy="448.8789" fill="#EDF2F7" rx="8" ry="8" style="stroke:#2D3748;stroke-width:2.0;"/><path d="M49.5586,456.8789 L49.5586,483.8789 M36.5586,464.8789 L62.5586,464.8789 M49.5586,483.8789 L36.5586,498.8789 M49.5586,483.8789 L62.5586,498.8789 " fill="none" style="stroke:#2D3748;stroke-width:2.0;"/><text fill="#000000" font-family="Segoe UI" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="87.1172" x="6" y="515.4414">Planificateur</text><text fill="#000000" font-family="Segoe UI" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="63.123" x="6" y="532.3809">(horloge)</text><text fill="#000000" font-family="Segoe UI" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="77.1777" x="10.9697" y="435.502">&#171;syst&#232;me&#187;</text></g><g id="elem_GMN14"><path d="M153,181.4395 L153,222.8984 A0,0 0 0 0 153,222.8984 L280,222.8984 L284,273.8895 L288,222.8984 L413.8208,222.8984 A0,0 0 0 0 413.8208,222.8984 L413.8208,191.4395 L403.8208,181.4395 L153,181.4395 A0,0 0 0 0 153,181.4395 " fill="#FFFBEA" style="stroke:#B7791F;stroke-width:0.5;"/><path d="M403.8208,181.4395 L403.8208,191.4395 L413.8208,191.4395 L403.8208,181.4395 " fill="#FFFBEA" style="stroke:#B7791F;stroke-width:0.5;"/><text fill="#000000" font-family="Segoe UI" font-size="13" lengthAdjust="spacing" textLength="239.8208" x="159" y="199.0332">v2 : les d&#233;lais viennent des param&#232;tres</text><text fill="#000000" font-family="Segoe UI" font-size="13" lengthAdjust="spacing" textLength="226.0845" x="159" y="214.7627">g&#233;n&#233;raux r&#233;gl&#233;s par l'administrateur.</text></g><g id="elem_GMN17"><path d="M157.5,105.4395 L157.5,146.8984 L409.3262,146.8984 L409.3262,115.4395 L399.3262,105.4395 L157.5,105.4395 " fill="#FFFBEA" style="stroke:#B7791F;stroke-width:0.5;"/><path d="M399.3262,105.4395 L399.3262,115.4395 L409.3262,115.4395 L399.3262,105.4395 " fill="#FFFBEA" style="stroke:#B7791F;stroke-width:1.0;"/><text fill="#000000" font-family="Segoe UI" font-size="13" lengthAdjust="spacing" textLength="198.6689" x="163.5" y="123.0332">Aucune archive n'est supprim&#233;e</text><text fill="#000000" font-family="Segoe UI" font-size="13" lengthAdjust="spacing" textLength="230.8262" x="163.5" y="138.7627">automatiquement (pas de nettoyage).</text></g><g id="elem_GMN20"><path d="M161,43.9395 L161,69.6689 L406.231,69.6689 L406.231,53.9395 L396.231,43.9395 L161,43.9395 " fill="#FFFBEA" style="stroke:#B7791F;stroke-width:0.5;"