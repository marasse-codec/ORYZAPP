ight="bold" lengthAdjust="spacing" textLength="183.5654" x="712.7687" y="196.5268">Rechercher une attribution</text><text fill="#000000" font-family="Segoe UI" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="224.5127" x="692.2951" y="213.4662">(n&#176; d'attribution, n&#176; de demande,</text><text fill="#000000" font-family="Segoe UI" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="230.6104" x="689.2462" y="230.4057">t&#233;l&#233;phone ou nom du demandeur)</text></g><g id="elem_UC_Brouillon"><ellipse cx="804.6663" cy="312.5727" fill="#E6F4EA" rx="128.6663" ry="28.1333" style="stroke:#1A202C;stroke-width:2.0;"/><text fill="#000000" font-family="Segoe UI" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="170.6523" x="716.3401" y="308.1342">Enregistrer un r&#232;glement</text><text fill="#000000" font-family="Segoe UI" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="80.8828" x="761.2249" y="325.0737">en brouillon</text></g><g id="elem_UC_Corriger"><ellipse cx="804.6729" cy="402.6118" fill="#E6F4EA" rx="111.1729" ry="27.1724" style="stroke:#1A202C;stroke-width:2.0;"/><text fill="#000000" font-family="Segoe UI" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="139.6104" x="731.8677" y="398.1733">Corriger / supprimer</text><text fill="#000000" font-family="Segoe UI" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="81.2588" x="761.0435" y="415.1128">un brouillon</text></g><g id="elem_UC_Soumettre"><ellipse cx="355.5264" cy="214.6447" fill="#E6F4EA" rx="101.5264" ry="22.7053" style="stroke:#1A202C;stroke-width:2.0;"/><text fill="#000000" font-family="Segoe UI" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="165.9219" x="272.5655" y="217.7375">Soumettre un r&#232;glement</text></g><g id="elem_UC_Attributions"><ellipse cx="355.3531" cy="385.3101" fill="#F7FAFC" rx="104.8531" ry="23.3706" style="stroke:#1A202C;stroke-width:2.0;"/><text