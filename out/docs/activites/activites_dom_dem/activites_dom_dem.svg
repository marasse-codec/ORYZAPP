e circuit</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="141" x="665" y="533.7296">dans le service concern&#233;.</text><rect fill="#FFFFFF" height="52.6882" rx="12.5" ry="12.5" style="stroke:#333333;stroke-width:0.5;" width="206" x="433" y="478.2133"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="186" x="443" y="501.0414">Imputer aux services comp&#233;tents</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="183" x="443" y="517.3855">selon les types d'appuis sollicit&#233;s</text><rect fill="#555555" height="6" rx="2.5" ry="2.5" style="stroke:#555555;stroke-width:1.0;" width="358" x="421" y="562.2457"/><line style="stroke:#000000;stroke-width:1.5;" x1="415" x2="415" y1="52.0839" y2="692.5898"/><rect fill="#FFFFFF" height="36.3441" rx="12.5" ry="12.5" style="stroke:#333333;stroke-width:0.5;" width="215" x="866" y="588.2457"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="195" x="876" y="611.0737">Recevoir le courrier de la demande</text><line style="stroke:#000000;stroke-width:1.5;" x1="860" x2="860" y1="52.0839" y2="692.5898"/><rect fill="#FFFFFF" height="36.3441" rx="12.5" ry="12.5" style="stroke:#333333;stroke-width:0.5;" width="215" x="1128" y="588.2457"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="195" x="1138" y="611.0737">Recevoir le courrier de la demande</text><rect fill="#555555" height="6" rx="2.5" ry="2.5" style="stroke:#555555;stroke-width:1.0;" width="264" x="1091" y="644.5898"/><ellipse cx="1114" cy="681.5898" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="1114" cy="681.5898" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><line style="stroke:#000000;stroke-width:1.5;" x1="1085" x2="1085" y1="52.0839" y2="692.5898"/><line style="stroke:#000000;stroke-width:1.5;" x1=