<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="870px" preserveAspectRatio="none" style="width:1084px;height:870px;background:#FFFFFF;" version="1.1" viewBox="0 0 1084 870" width="1084px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="Arial" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="335" x="373.25" y="34.9659">R&#233;ception et instruction d'une demande d'appui</text><rect fill="none" height="16.3441" style="stroke:none;stroke-width:1.0;" width="1051.5" x="15" y="52.0839"/><ellipse cx="110.5" cy="83.4281" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#FFFFFF" height="52.6882" rx="12.5" ry="12.5" style="stroke:#333333;stroke-width:0.5;" width="179" x="21" y="113.4281"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="115" x="31" y="136.2561">Constituer le dossier</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="159" x="31" y="152.6003">(lettre + pi&#232;ces justificatives)</text><rect fill="#FFFFFF" height="69.0323" rx="12.5" ry="12.5" style="stroke:#333333;stroke-width:0.5;" width="172" x="24.5" y="186.1163"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="127" x="34.5" y="208.9444">Transmettre le dossier</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="152" x="34.5" y="225.2885">(d&#233;l&#233;gu&#233; de p&#244;le, centre de</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="148" x="34.5" y="241.6326">conditionnement ou si&#232;ge)</text><line style="stroke:#000000;stroke-width:1.5;" x1="15" x2="15" y1="52.0839" y2="858.6545"/><rect fill="#FFFFFF" height="36.3441" rx="12.5" ry="12.5" style="stroke:#333333;stroke-width:0.5;" width="155" x="233" y="275.1486"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="135" x="243" y="297.9767">R&#233;ceptionner le courrier</text><rect fill="#FFFFFF" height="52.6882" rx="12.5" ry="12.5" style="stroke:#333333;stroke-width:0.5;" width="168" x="226.5" y="331.4927"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="148" x="236.5" y="354.3208">Enregistrer dans le logiciel</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="135" x="236.5" y="370.6649">de gestion des courriers</text><rect fill="#FFFFFF" height="52.6882" rx="12.5" ry="12.5" style="stroke:#333333;stroke-width:0.5;" width="176" x="222.5" y="404.181"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="156" x="232.5" y="427.0091">Imputer le courrier &#224; la DAP</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="108" x="232.5" y="443.3532">et &#233;tablir les copies</text><line style="stroke:#000000;stroke-width:1.5;" x1="204" x2="204" y1="52.0839" y2="858.6545"/><path d="M647,466.8692 L647,500.5574 L627,504.5574 L647,508.5574 L647,542.2457 A0,0 0 0 0 647,542.2457 L843,542.2457 A0,0 0 0 0 843,542.2457 L843,476.8692 L833,466.8692 L647,466.8692 A0,0 0 0 0 647,466.8692 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M833,466.8692 L833,476.8692 L843,476.8692 L833,466.8692 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="175" x="653" y="484.6973">Une lettre portant sur plusieurs</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="164" x="653" y="501.0414">types d'appuis est d&#233;coup&#233;e :</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="153" x="653" y="517.3855">chaque partie suit ce circuit</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="141" x="653" y="533.7296">dans le service concern&#233;.</text><rect fill="#FFFFFF" height="52.6882" rx="12.5" ry="12.5" style="stroke:#333333;stroke-width:0.5;" width="206" x="421" y="478.2133"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="186" x="431" y="501.0414">Imputer aux services comp&#233;tents</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="183" x="431" y="517.3855">selon les types d'appuis sollicit&#233;s</text><line style="stroke:#000000;stroke-width:1.5;" x1="415" x2="415" y1="52.0839" y2="858.6545"/><rect fill="#FFFFFF" height="52.6882" rx="12.5" ry="12.5" style="stroke:#333333;stroke-width:0.5;" width="190" x="863" y="562.2457"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="132" x="873" y="585.0737">Enregistrer la demande</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="170" x="873" y="601.4179">dans le fichier Excel du service</text><rect fill="#FFFFFF" height="52.6882" rx="12.5" ry="12.5" style="stroke:#333333;stroke-width:0.5;" width="174" x="871" y="634.9339"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="130" x="881" y="657.762">Examiner la conformit&#233;</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="154" x="881" y="674.1061">et la compl&#233;tude du dossier</text><rect fill="#FFFFFF" height="52.6882" rx="12.5" ry="12.5" style="stroke:#333333;stroke-width:0.5;" width="129" x="893.5" y="707.6221"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="107" x="903.5" y="730.4502">Pr&#233;parer le dossier</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="109" x="903.5" y="746.7943">p